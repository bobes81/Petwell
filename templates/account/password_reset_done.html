{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container text-center my-5">
    <div class="card mx-auto p-4" style="max-width:500px;">
        <img src="{% static 'images/placeholder.svg' %}" alt="PetWell Logo" style="width:100px;margin-bottom:1rem;">
        <h1 class="h2 text-primary mb-3">Password Reset</h1>
        <p class="text-muted">
            If an account uses that email address, a password reset link has been requested.<br>
            Check your inbox or spam folder. If no message arrives, try again or contact the shop.
        </p>
        <a href="{% url 'account_login' %}" class="btn btn-primary mt-3">Back to Sign In</a>
    </div>
</div>
{% endblock %}
