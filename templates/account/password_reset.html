{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container text-center my-5">
    <div class="card mx-auto p-4" style="max-width:500px;">
        <img src="{% static 'images/placeholder.svg' %}" alt="PetWell Logo" style="width:100px;margin-bottom:1rem;">
        <h1 class="h2 text-primary mb-3">Reset Your Password</h1>
        <p class="text-muted">Enter your email address and we’ll send you a link to reset your password.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-3">Send Reset Link</button>
        </form>
    </div>
</div>
{% endblock %}
