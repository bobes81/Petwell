{% extends "base.html" %}
{% block content %}
<h1>Checkout</h1>
{% if cart_error %}
<p role="alert">{{ cart_error }}</p><a href="{% url 'cart:view_cart' %}">Return to cart</a>
{% else %}
<p>Total: <strong>£{{ total }}</strong>. Card details are entered securely on Stripe.</p>
<form method="post" class="mx-auto" style="max-width: 600px">
  {% csrf_token %}{{ form.as_p }}
  <button class="btn btn-primary" type="submit">Continue to secure payment</button>
  <a href="{% url 'cart:view_cart' %}" class="btn btn-secondary">Back to cart</a>
</form>
{% endif %}
{% endblock %}
