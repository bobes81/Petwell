{% extends "base.html" %}
{% block title %}Delete pet profile | PetWell{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 650px;">
    <h1>Delete pet profile</h1>
    <p>Delete the profile and saved care notes for <strong>{{ pet.name }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-danger">Delete profile</button>
            <a href="{% url 'pets:list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
